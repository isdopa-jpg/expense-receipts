<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipts</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Receipts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f5f4; --card: #ffffff; --ink: #14201e; --muted: #64716f;
    --line: #dde2e0; --accent: #0f766e; --accent-ink: #ffffff; --danger: #b42318;
    --chip: #e8efed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1413; --card: #18211f; --ink: #e8eeec; --muted: #93a19e;
      --line: #2a3634; --accent: #2bb3a6; --accent-ink: #06211e; --danger: #ff8a7a;
      --chip: #22302d;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 4px 0 2px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: 0; border-radius: 14px; padding: 16px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; text-align: center;
  }
  .btn.big { padding: 26px 16px; font-size: 19px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn.plain { background: transparent; color: var(--muted); padding: 10px; font-weight: 500; }
  .btn:disabled { opacity: .5; }
  .btn + .btn, label.btn + label.btn { margin-top: 10px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input.in, select.in {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px;
    -webkit-appearance: none; appearance: none;
  }
  input.in:focus, select.in:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; }
  .row > :first-child { flex: 1; min-width: 0; }
  .row select { width: 96px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .seg { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 11px; border-radius: 9px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .preview { display: flex; gap: 14px; align-items: center; }
  .preview img { width: 84px; height: 112px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .status { font-size: 14px; color: var(--muted); }
  .status b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 2px; }
  .fname { margin: 16px 0; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px dashed var(--line); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .fname span { display: block; font-family: -apple-system, "Segoe UI", sans-serif; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 button { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; padding: 4px 0; }
  ul.hist { list-style: none; margin: 0; padding: 0; }
  ul.hist li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  ul.hist li:first-child { border-top: 0; }
  ul.hist small { display: block; color: var(--muted); font-size: 12px; }
  ul.hist .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .tip { font-size: 13px; color: var(--muted); margin: 12px 2px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Receipts</h1>
  <p class="sub">Snap a receipt → named PDF → your Expenses folder.</p>

  <!-- Step 1: capture -->
  <section id="capture">
    <label class="btn big" for="cam">📷 Take photo of receipt</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <label class="btn ghost" for="lib">Choose from photos</label>
    <input id="lib" type="file" accept="image/*">
    <p class="tip" id="tipShare">When saving, pick <b>Save to Files → OneDrive → Desktop → Expenses</b>. iOS remembers the folder after the first time.</p>
    <div id="odBox" hidden>
      <p class="tip" id="odStatus"></p>
      <button class="btn ghost" id="odConnect" hidden>Connect OneDrive</button>
    </div>
  </section>

  <!-- Step 2: review -->
  <section id="review" hidden>
    <div class="card">
      <div class="preview">
        <img id="thumb" alt="Receipt preview">
        <div class="status"><b id="statusTitle">Reading receipt…</b><span id="statusText">Looking for date and total.</span></div>
      </div>

      <label class="field" for="fDate">Date</label>
      <input class="in" id="fDate" type="date">

      <label class="field" for="fName">Expense</label>
      <input class="in" id="fName" type="text" placeholder="e.g. Lunch Kronenhalle" autocomplete="off" autocapitalize="words">
      <div class="chips" id="chips"></div>

      <label class="field" for="fAmount">Amount</label>
      <div class="row">
        <input class="in" id="fAmount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
        <select class="in" id="fCur"><option>CHF</option><option>EUR</option><option>USD</option><option>GBP</option></select>
      </div>

      <label class="field">Company</label>
      <div class="seg" id="companySeg"></div>

      <div class="fname"><span id="destLabel">File name</span><div id="fnamePreview"></div></div>

      <button class="btn" id="saveBtn">Save PDF</button>
      <button class="btn ghost" id="retryOd" hidden>Try OneDrive again</button>
      <button class="btn plain" id="discardBtn">Discard</button>
    </div>
  </section>

  <section class="card" id="histCard">
    <h2>Saved receipts <button id="csvBtn" hidden>Export CSV</button></h2>
    <ul class="hist" id="hist"></ul>
    <p class="empty" id="histEmpty">Nothing yet.</p>
  </section>

  <section class="card">
    <h2>AI reading <button id="aiToggle">Set up</button></h2>
    <p class="empty" id="aiStatus"></p>
    <div id="aiForm" hidden>
      <label class="field" for="aiKeyIn">Anthropic API key</label>
      <input class="in" id="aiKeyIn" type="password" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="aiSave" style="margin-top:12px">Save key</button>
      <button class="btn plain" id="aiRemove">Remove key</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const CATEGORIES = ["Lunch", "Dinner", "Coffee", "Taxi", "Train", "Parking", "Fuel", "Hotel", "Flight", "Office"];
const HIST_KEY = "receipts.history.v1";
const COMPANIES = ["Extend", "Gambit"];
const COMPANY_KEY = "receipts.company.v1";
let company = (() => { try { const c = localStorage.getItem(COMPANY_KEY); return COMPANIES.includes(c) ? c : COMPANIES[0]; } catch { return COMPANIES[0]; } })();
// Receipts are filed as <Company>/<YYYY-MM>/ by the receipt date.
const destFolder = date => company + "/" + (date || todayISO()).slice(0, 7);
let current = null;      // { dataUrl, w, h }
let touched = {};        // fields the user edited by hand: never overwrite those with OCR results
let ocrRun = 0;

/* ---------- OneDrive (direct upload) ----------
   Fill in clientId + tenantId from the Microsoft Entra app registration.
   While clientId is empty the app uses the iOS share sheet instead. */
const ONEDRIVE = { clientId: "859774cb-5ffa-4480-82fc-15db9e8c93ad", tenantId: "1e9cc1f4-870c-454d-a147-bb10407de282", folder: "Desktop/Expenses" };
const OD_SCOPES = ["Files.ReadWrite"];
let msalApp = null, odAccount = null, forceShare = false;

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function odRender(note) {
  $("odBox").hidden = false; $("tipShare").hidden = !!odAccount;
  $("odConnect").hidden = !!odAccount;
  $("odStatus").textContent = note || (odAccount
    ? `OneDrive connected (${odAccount.username}). Receipts are saved straight to ${ONEDRIVE.folder.replace(/\//g, " › ")}, by company and month.`
    : "Connect OneDrive once to save receipts straight to your Expenses folder.");
  $("saveBtn").textContent = msalApp ? "Save to OneDrive" : "Save PDF";
}
// The app usually stays open in the background on iOS; renew the sign-in quietly whenever it comes back.
let odRenewing = false;
async function odRenew() {
  if (!msalApp || !odAccount || odRenewing) return;
  odRenewing = true;
  try { await msalApp.acquireTokenSilent({ scopes: OD_SCOPES, account: odAccount }); }
  catch (e) {
    // Only bounce to the sign-in page when no receipt is in progress; otherwise Save handles it.
    if (e instanceof msal.InteractionRequiredAuthError && !current) msalApp.acquireTokenRedirect({ scopes: OD_SCOPES, account: odAccount });
  }
  odRenewing = false;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") odRenew(); });
async function odInit() {
  if (!ONEDRIVE.clientId) return;
  try {
    await loadScript("https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js");
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: ONEDRIVE.clientId,
        authority: "https://login.microsoftonline.com/" + (ONEDRIVE.tenantId || "organizations"),
        redirectUri: location.origin + location.pathname.replace(/index\.html$/, "")
      },
      cache: { cacheLocation: "localStorage" }
    });
    const r = await msalApp.handleRedirectPromise();
    odAccount = (r && r.account) || msalApp.getAllAccounts()[0] || null;
    const pending = !!localStorage.getItem(PENDING_KEY);
    if (odAccount && !pending) {
      // Sign-ins expire about daily; renew now, before a photo is taken, rather than at save time.
      try { await msalApp.acquireTokenSilent({ scopes: OD_SCOPES, account: odAccount }); }
      catch (e) {
        if (e instanceof msal.InteractionRequiredAuthError) return msalApp.acquireTokenRedirect({ scopes: OD_SCOPES, account: odAccount });
      }
    }
    odRender();
  } catch (e) {
    console.error(e);
    odRender("OneDrive sign-in failed: " + (e.errorMessage || e.message || e));
  }
}
async function odUpload(blob, fileName, subFolder) {
  const { accessToken } = await msalApp.acquireTokenSilent({ scopes: OD_SCOPES, account: odAccount });
  // Missing folders in the path (e.g. a new month) are created by OneDrive on upload.
  const path = (ONEDRIVE.folder + "/" + subFolder).split("/").concat(fileName).map(encodeURIComponent).join("/");
  const resp = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${path}:/content?@microsoft.graph.conflictBehavior=rename`, {
    method: "PUT", headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/pdf" }, body: blob
  });
  if (!resp.ok) throw new Error("OneDrive upload failed (" + resp.status + ")");
  return (await resp.json()).name;
}

/* ---------- helpers ---------- */
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200);
}
function parseAmount(s) {
  if (!s) return null;
  let v = String(s).replace(/[^\d.,]/g, "");
  if (!v) return null;
  const lastSep = Math.max(v.lastIndexOf("."), v.lastIndexOf(","));
  if (lastSep >= 0 && v.length - lastSep - 1 <= 2) {
    v = v.slice(0, lastSep).replace(/[.,]/g, "") + "." + v.slice(lastSep + 1);
  } else {
    v = v.replace(/[.,]/g, "");
  }
  const n = parseFloat(v);
  return isFinite(n) ? n : null;
}
function cleanName(s) {
  return (s || "").replace(/[\\/:*?"<>|_\u0000-\u001f]/g, " ").replace(/\s+/g, " ").trim().replace(/[. ]+$/, "").slice(0, 60);
}
function buildFileName(date, name, amount, cur) {
  const n = cleanName(name).replace(/ /g, "-") || "Expense";
  const a = amount == null ? "0.00" : amount.toFixed(2);
  return `${date || todayISO()}_${n}_${cur}-${a}.pdf`;
}

/* ---------- receipt text parsing ---------- */
const AMT_RE = /(\d{1,3}(?:['’ ]\d{3})+|\d+)\s?[.,]\s?(\d{2})(?!\d)/g;
function amountsIn(line) {
  const out = []; let m; AMT_RE.lastIndex = 0;
  while ((m = AMT_RE.exec(line))) out.push(parseFloat(m[1].replace(/\D/g, "") + "." + m[2]));
  return out;
}
function parseReceipt(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const res = { date: null, amount: null, currency: null, merchant: null };

  // Date
  const validY = y => y >= 2015 && y <= new Date().getFullYear() + 1;
  const iso = (y, m, d) => (validY(y) && m >= 1 && m <= 12 && d >= 1 && d <= 31)
    ? `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}` : null;
  for (const l of lines) {
    let m = l.match(/\b(\d{1,2})\s?[.\/-]\s?(\d{1,2})\s?[.\/-]\s?(20\d{2}|\d{2})\b/);
    if (m) { const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; res.date = iso(y, +m[2], +m[1]); }
    if (!res.date) { m = l.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/); if (m) res.date = iso(+m[1], +m[2], +m[3]); }
    if (res.date) break;
  }

  // Amount: prefer lines that say "total"; skip tax / cash-given / change lines
  const TOTAL = /\b(total|summe|gesamt|betrag|zu zahlen|zahlbetrag|endbetrag|montant|totale|importo|amount due|à payer)\b/i;
  const SKIP = /(mwst|mehrwert|vat|tva|iva|steuer|netto|subtotal|zwischensumme|sous-total|gegeben|erhalten|rückgeld|retour|wechselgeld|change|trinkgeld|tip)/i;
  let best = null, any = null;
  lines.forEach((l, i) => {
    const a = amountsIn(l);
    if (!SKIP.test(l) && a.length) any = Math.max(any ?? 0, ...a);
    if (TOTAL.test(l) && !SKIP.test(l)) {
      let c = a;
      if (!c.length && lines[i + 1] && !SKIP.test(lines[i + 1])) c = amountsIn(lines[i + 1]); // amount on next line
      if (c.length) best = Math.max(best ?? 0, c[c.length - 1]);
    }
  });
  res.amount = best ?? any;

  // Currency
  if (/\b(CHF|SFR|Fr\.)/i.test(text)) res.currency = "CHF";
  else if (/(€|\bEUR\b)/i.test(text)) res.currency = "EUR";
  else if (/(£|\bGBP\b)/i.test(text)) res.currency = "GBP";
  else if (/(\$|\bUSD\b)/i.test(text)) res.currency = "USD";

  // Merchant: first line near the top that looks like a name
  for (const l of lines.slice(0, 6)) {
    const letters = (l.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    if (letters >= 3 && letters / l.length > 0.6 && !/(rechnung|quittung|beleg|receipt|invoice|kassenbon|tel|www|mwst|che-)/i.test(l)) {
      res.merchant = cleanName(l.replace(/[^A-Za-zÀ-ÿ0-9&' .-]/g, " "))
        .toLowerCase().replace(/(^|[\s-])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase()).slice(0, 30);
      break;
    }
  }
  return res;
}

/* ---------- AI reading (Claude) ----------
   The API key is typed in on the phone and kept only in this browser's storage. */
const AI_KEY = "receipts.aiKey.v1";
const AI_MODEL = "claude-opus-5-5";
const aiKey = () => { try { return localStorage.getItem(AI_KEY) || ""; } catch { return ""; } };
const AI_SCHEMA = {
  type: "object", additionalProperties: false,
  required: ["date", "amount", "currency", "merchant", "category"],
  properties: {
    date: { type: ["string", "null"], description: "Date of purchase as YYYY-MM-DD" },
    amount: { type: ["number", "null"], description: "Final total actually paid, including tax and tip" },
    currency: { type: ["string", "null"], description: "ISO code: CHF, EUR, USD or GBP" },
    merchant: { type: ["string", "null"], description: "Short merchant name, e.g. 'Kronenhalle', without legal form or address" },
    category: { type: ["string", "null"], description: "One of: " + CATEGORIES.join(", ") + ", or null if none fits" }
  }
};
function aiImage(canvas) {
  const MAX = 1568, s = Math.min(1, MAX / Math.max(canvas.width, canvas.height));
  const c = document.createElement("canvas");
  c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
  c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}
async function aiCall(body, extraHeaders) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: Object.assign({
      "content-type": "application/json", "x-api-key": aiKey(),
      "anthropic-version": "2026-10-21", "anthropic-dangerous-direct-browser-access": "true"
    }, extraHeaders),
    body: JSON.stringify(body)
  });
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok) { const e = new Error((json.error && json.error.message) || ("HTTP " + resp.status)); e.status = resp.status; throw e; }
  return json;
}
async function aiRead(canvas) {
  const base = {
    model: AI_MODEL, max_tokens: 4000,
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data: aiImage(canvas) } },
      { type: "text", text:
        "This is a photo of an expense receipt, most likely from Switzerland (German, French, Italian or English). " +
        "Extract the purchase date, the final total actually paid (including tax and tip; not a subtotal, not the VAT amount, not cash given or change), " +
        "the currency, a short merchant name, and the best-fitting category (for restaurants use the time of day on the receipt: Lunch before 15:00, Dinner after 17:00). " +
        "Dates on Swiss receipts are day.month.year. Today is " + todayISO() + ". Use null for anything you cannot read with confidence. " +
        "Reply with only a JSON object with the keys date (YYYY-MM-DD), amount (number), currency, merchant, category." }
    ] }]
  };
  let msg;
  try {
    msg = await aiCall(Object.assign({}, base, {
      output_config: { effort: "low", format: { type: "json_schema", schema: AI_SCHEMA } },
      fallbacks: "default"
    }), { "anthropic-beta": "server-side-fallback-2026-07-01" });
  } catch (e) {
    if (e.status !== 400) throw e;
    msg = await aiCall(base); // plain request if an optional setting was rejected
  }
  if (msg.stop_reason === "refusal") throw new Error("The AI declined to read this image");
  const text = (msg.content || []).filter(b => b.type === "text").map(b => b.text).join("");
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error("Unexpected AI answer");
  const r = JSON.parse(m[0]);
  const cat = CATEGORIES.find(c => c.toLowerCase() === String(r.category || "").toLowerCase());
  const merchant = cleanName(r.merchant || "").slice(0, 30);
  return {
    date: /^\d{4}-\d{2}-\d{2}$/.test(r.date || "") ? r.date : null,
    amount: typeof r.amount === "number" && r.amount > 0 ? r.amount : null,
    currency: ["CHF", "EUR", "USD", "GBP"].includes(r.currency) ? r.currency : null,
    merchant: [cat, merchant].filter(Boolean).join(" ") || null
  };
}

/* ---------- OCR ---------- */
let workerPromise = null;
function getWorker() {
  if (!workerPromise) {
    workerPromise = Tesseract.createWorker(["deu", "eng"]).catch(e => { workerPromise = null; throw e; });
  }
  return workerPromise;
}
async function runOcr(canvas) {
  const run = ++ocrRun;
  let aiNote = "";
  if (aiKey()) {
    try {
      const p = await aiRead(canvas);
      if (run !== ocrRun || !current) return;
      applyParsed(p);
      return;
    } catch (e) {
      console.error(e);
      if (run !== ocrRun || !current) return;
      aiNote = "AI reading failed (" + (e.message || e) + "), used basic reading. ";
      $("statusText").textContent = aiNote;
    }
  }
  try {
    const worker = await getWorker();
    const { data } = await worker.recognize(canvas);
    if (run !== ocrRun || !current) return;
    applyParsed(parseReceipt(data.text || ""));
    if (aiNote) $("statusText").textContent = aiNote + $("statusText").textContent;
  } catch (e) {
    console.error(e);
    if (run !== ocrRun) return;
    $("statusTitle").textContent = "Couldn't read receipt";
    $("statusText").textContent = "Fill in the details below.";
  }
}
function applyParsed(p) {
  const found = [];
  if (p.date && !touched.date) { $("fDate").value = p.date; found.push("date"); }
  if (p.amount != null && !touched.amount) { $("fAmount").value = p.amount.toFixed(2); found.push("total"); }
  if (p.currency && !touched.cur) $("fCur").value = p.currency;
  if (p.merchant && !touched.name) { $("fName").value = p.merchant; found.push("merchant"); }
  $("statusTitle").textContent = found.length ? "Check the details" : "Couldn't read receipt";
  $("statusText").textContent = found.length ? "Found " + found.join(", ") + ". Correct anything that's off." : "Fill in the details below.";
  updateFileName();
}

/* ---------- image intake ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Unsupported image")); };
    img.src = url;
  });
}
async function onFile(file) {
  if (!file) return;
  try {
    const img = await loadImage(file);
    const MAX = 2000;
    const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    startReview(c);
  } catch (e) {
    toast("Couldn't open that photo.");
  }
}
function startReview(canvas) {
  current = { dataUrl: canvas.toDataURL("image/jpeg", 0.82), w: canvas.width, h: canvas.height };
  touched = {};
  $("thumb").src = current.dataUrl;
  $("fDate").value = todayISO(); $("fName").value = ""; $("fAmount").value = "";
  $("statusTitle").textContent = "Reading receipt…";
  $("statusText").textContent = "Looking for date and total.";
  $("capture").hidden = true; $("review").hidden = false;
  updateFileName();
  window.scrollTo(0, 0);
  return runOcr(canvas);
}
function resetAll() {
  ocrRun++; current = null;
  $("cam").value = ""; $("lib").value = "";
  $("review").hidden = true; $("capture").hidden = false;
}

/* ---------- form ---------- */
function formValues() {
  return { date: $("fDate").value || todayISO(), name: cleanName($("fName").value), amount: parseAmount($("fAmount").value), cur: $("fCur").value };
}
function updateFileName() {
  const v = formValues();
  $("fnamePreview").textContent = buildFileName(v.date, v.name, v.amount, v.cur);
  $("destLabel").textContent = "Saves to Expenses › " + destFolder(v.date).replace("/", " › ");
}
COMPANIES.forEach(c => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = c; b.classList.toggle("on", c === company);
  b.addEventListener("click", () => {
    company = c;
    try { localStorage.setItem(COMPANY_KEY, c); } catch {}
    [...$("companySeg").children].forEach(x => x.classList.toggle("on", x === b));
    updateFileName();
  });
  $("companySeg").appendChild(b);
});
$("fDate").addEventListener("input", () => { touched.date = true; updateFileName(); });
$("fName").addEventListener("input", () => { touched.name = true; updateFileName(); });
$("fAmount").addEventListener("input", () => { touched.amount = true; updateFileName(); });
$("fCur").addEventListener("change", () => { touched.cur = true; updateFileName(); });
CATEGORIES.forEach(cat => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = cat;
  b.addEventListener("click", () => {
    let rest = $("fName").value.trim();
    for (const c of CATEGORIES) if (rest.toLowerCase().startsWith(c.toLowerCase() + " ") || rest.toLowerCase() === c.toLowerCase()) { rest = rest.slice(c.length).trim(); break; }
    $("fName").value = (cat + " " + rest).trim();
    touched.name = true; updateFileName();
  });
  $("chips").appendChild(b);
});
$("cam").addEventListener("change", e => onFile(e.target.files[0]));
$("lib").addEventListener("change", e => onFile(e.target.files[0]));
$("discardBtn").addEventListener("click", resetAll);

/* ---------- PDF + save ---------- */
function buildPdf(v, fileName) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
  const PW = 210, PH = 297, M = 12, HEAD = 10;
  doc.setProperties({ title: fileName.replace(/\.pdf$/, ""), subject: "Expense receipt", keywords: `${v.date}; ${v.name}; ${v.cur} ${v.amount.toFixed(2)}` });
  doc.setFontSize(10); doc.setTextColor(60);
  doc.text(`${v.date}   |   ${v.name}   |   ${v.cur} ${v.amount.toFixed(2)}`, M, M + 3);
  const boxW = PW - 2 * M, boxH = PH - 2 * M - HEAD;
  const s = Math.min(boxW / current.w, boxH / current.h);
  const w = current.w * s, h = current.h * s;
  doc.addImage(current.dataUrl, "JPEG", (PW - w) / 2, M + HEAD, w, h, undefined, "FAST");
  return doc.output("blob");
}
$("saveBtn").addEventListener("click", async () => {
  if (!current) return;
  const v = formValues();
  if (!v.name) { toast("Add an expense name."); $("fName").focus(); return; }
  if (v.amount == null || v.amount <= 0) { toast("Add the amount."); $("fAmount").focus(); return; }
  const fileName = buildFileName(v.date, v.name, v.amount, v.cur);
  let blob;
  try { blob = buildPdf(v, fileName); }
  catch (e) { console.error(e); toast("Couldn't create the PDF."); return; }
  const file = new File([blob], fileName, { type: "application/pdf" });

  await odReady; // never fall back to the share sheet just because sign-in is still loading
  if (msalApp && !forceShare) {
    const btn = $("saveBtn");
    if (!odAccount) { stashPending(); toast("Signing in to OneDrive…"); msalApp.loginRedirect({ scopes: OD_SCOPES }); return; }
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const dest = destFolder(v.date);
      const savedName = await odUpload(blob, fileName, dest);
      addHistory({ date: v.date, name: v.name, amount: v.amount, cur: v.cur, file: savedName, company });
      resetAll();
      toast("Saved to " + dest.replace("/", " › ") + ": " + savedName);
    } catch (e) {
      console.error(e);
      if (e instanceof msal.InteractionRequiredAuthError) {
        // The OneDrive sign-in has expired: renew it and come back to this receipt.
        stashPending(); toast("Renewing OneDrive sign-in…");
        msalApp.acquireTokenRedirect({ scopes: OD_SCOPES, account: odAccount });
        return;
      }
      forceShare = true; // next tap only: share sheet, so the receipt isn't lost
      toast("OneDrive upload failed (" + (e.message || e) + "). Tap again to try once more, or use the share sheet.");
    }
    btn.disabled = false; btn.textContent = forceShare ? "Share PDF instead" : "Save to OneDrive";
    $("retryOd").hidden = !forceShare;
    return;
  }
  forceShare = false; $("retryOd").hidden = true; // the fallback applies to one save only

  let saved = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); saved = true; }
    catch (e) { if (e.name !== "AbortError") { console.error(e); downloadBlob(blob, fileName); saved = true; } }
  } else {
    downloadBlob(blob, fileName); saved = true;
  }
  if (!saved) return; // share sheet cancelled: keep the form so nothing is lost
  addHistory({ date: v.date, name: v.name, amount: v.amount, cur: v.cur, file: fileName, company });
  resetAll();
  toast("Saved " + fileName);
});
$("retryOd").addEventListener("click", () => { forceShare = false; $("retryOd").hidden = true; $("saveBtn").textContent = "Save to OneDrive"; $("saveBtn").click(); });

/* A receipt in progress survives the trip to the Microsoft sign-in page and back. */
const PENDING_KEY = "receipts.pending.v1";
function stashPending() {
  if (!current) return;
  try {
    localStorage.setItem(PENDING_KEY, JSON.stringify({ img: current, date: $("fDate").value, name: $("fName").value, amount: $("fAmount").value, cur: $("fCur").value, at: Date.now() }));
  } catch (e) { console.error(e); }
}
function restorePending() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PENDING_KEY)); localStorage.removeItem(PENDING_KEY); } catch {}
  if (!p || !p.img || Date.now() - p.at > 15 * 60 * 1000) return;
  current = p.img; touched = { date: true, name: true, amount: true, cur: true };
  $("thumb").src = current.dataUrl;
  $("fDate").value = p.date; $("fName").value = p.name; $("fAmount").value = p.amount; $("fCur").value = p.cur;
  $("statusTitle").textContent = "Ready to save";
  $("statusText").textContent = odAccount ? "OneDrive is connected. Tap Save to OneDrive." : "OneDrive sign-in didn't complete. Tap Save to try again.";
  $("capture").hidden = true; $("review").hidden = false;
  updateFileName();
}
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

/* ---------- history ---------- */
function getHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; } }
function addHistory(entry) {
  const h = getHistory(); h.unshift(entry);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 500))); } catch {}
  renderHistory();
}
function renderHistory() {
  const h = getHistory(), ul = $("hist");
  ul.textContent = "";
  h.slice(0, 15).forEach(e => {
    const li = document.createElement("li");
    const left = document.createElement("div"); left.textContent = e.name;
    const sm = document.createElement("small"); sm.textContent = e.date + (e.company ? " · " + e.company : ""); left.appendChild(sm);
    const right = document.createElement("div"); right.className = "amt"; right.textContent = `${e.cur} ${Number(e.amount).toFixed(2)}`;
    li.append(left, right); ul.appendChild(li);
  });
  $("histEmpty").hidden = h.length > 0;
  $("csvBtn").hidden = h.length === 0;
}
$("csvBtn").addEventListener("click", async () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["Date", "Company", "Expense", "Amount", "Currency", "File"].join(";")]
    .concat(getHistory().map(e => [e.date, q(e.company || ""), q(e.name), Number(e.amount).toFixed(2), e.cur, q(e.file)].join(";")));
  const blob = new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv" });
  const name = `Expenses_export_${todayISO()}.csv`;
  const file = new File([blob], name, { type: "text/csv" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== "AbortError") downloadBlob(blob, name); }
  } else downloadBlob(blob, name);
});

$("odConnect").addEventListener("click", () => { if (msalApp) msalApp.loginRedirect({ scopes: OD_SCOPES }); });
function aiRender() {
  const on = !!aiKey();
  $("aiStatus").textContent = on
    ? "On. Receipts are read by Claude; the photo is sent to Anthropic for that. The key is stored only on this device."
    : "Off. Receipts are read on the device, which is less accurate. Add an Anthropic API key to turn on AI reading.";
  $("aiToggle").textContent = on ? "Change" : "Set up";
  $("aiRemove").hidden = !on;
}
$("aiToggle").addEventListener("click", () => { $("aiForm").hidden = !$("aiForm").hidden; });
$("aiSave").addEventListener("click", () => {
  const k = $("aiKeyIn").value.trim();
  if (!k) { toast("Paste your API key first."); return; }
  try { localStorage.setItem(AI_KEY, k); } catch { toast("Couldn't store the key on this device."); return; }
  $("aiKeyIn").value = ""; $("aiForm").hidden = true; aiRender(); toast("AI reading is on.");
});
$("aiRemove").addEventListener("click", () => {
  try { localStorage.removeItem(AI_KEY); } catch {}
  $("aiForm").hidden = true; aiRender(); toast("AI reading is off.");
});
renderHistory();
aiRender();
const odReady = odInit().then(restorePending, restorePending);
// Warm up the on-device text recogniser when it is the one in use.
window.addEventListener("load", () => { if (window.Tesseract && !aiKey()) getWorker().catch(() => {}); });
</script>
